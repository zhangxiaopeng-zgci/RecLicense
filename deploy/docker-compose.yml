version: '3.8'

services:
  mongodb:
    image: mongo:6.0
    container_name: reclicense-mongo
    command: mongod --bind_ip=0.0.0.0
    ports:
      - "${RECLIC_MONGO_PORT:-27017}:27017"
    volumes:
      - ${RECLIC_DATA_DIR}/mongodb:/data/db
    networks:
      - reclicense
    mem_limit: "10g"
    restart: always
    logging:
      options:
        max-size: "10m"
        max-file: "5"

  backend:
    build:
      context: ../
      dockerfile: ./deploy/backend.dockerfile
    container_name: reclicense-backend
    ports:
      - "${RECLIC_BACKEND_PORT:-5000}:5000"
    environment:
      # Multi-platform Git tokens
      GITHUB_TOKEN: ${GITHUB_TOKEN}
      GITEE_TOKEN: ${GITEE_TOKEN:-}
      GITLAB_TOKEN: ${GITLAB_TOKEN:-}
      GITEE_PRIVATE_TOKEN: ${GITEE_PRIVATE_TOKEN:-}
      # MongoDB connection
      RECLIC_MONGO_PORT: ${RECLIC_MONGO_PORT:-mongodb:27017}
    volumes:
      - ${RECLIC_DATA_DIR}/files/:/backend/temp_files/
      - ../backend/config:/backend/config:ro
    depends_on:
      - mongodb
    networks:
      - reclicense
    mem_limit: "6g"
    restart: always
    logging:
      options:
        max-size: "10m"
        max-file: "5"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/api/git_platforms"]
      interval: 10s
      timeout: 5s
      retries: 5

  frontend:
    build:
      context: ../
      dockerfile: ./deploy/frontend.dockerfile
      args:
        NODE_ENV: ${NODE_ENV:-production}
        REACT_APP_BASE_URL: ${REACT_APP_BASE_URL:-http://localhost:5000}
    container_name: reclicense-frontend
    ports:
      - "${RECLIC_HTTP_PORT:-80}:80"
      - "${RECLIC_HTTPS_PORT:-443}:443"
    environment:
      - REACT_APP_BASE_URL
      - RECLIC_DOMAIN
    volumes:
      - ${RECLIC_DATA_DIR}/certs/:/data/caddy/certificates/acme-v02.api.letsencrypt.org-directory/
    depends_on:
      - backend
    networks:
      - reclicense
    mem_limit: "2g"
    restart: always
    logging:
      options:
        max-size: "10m"
        max-file: "5"

networks:
  reclicense:
    driver: bridge
