---
apiVersion: v1
kind: Namespace
metadata:
  name: reclicense

---
apiVersion: v1
kind: Secret
metadata:
  name: reclicense-config
  namespace: reclicense
type: Opaque
stringData:
  GITHUB_TOKEN: "YOUR_GITHUB_TOKEN"
  MONGO_HOST: "mongodb"
  MONGO_PORT: "27017"
  REACT_APP_BASE_URL: "http://localhost:5000"

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mongodb-pvc
  namespace: reclicense
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 50Gi
  storageClassName: local-path

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: backend-files-pvc
  namespace: reclicense
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 20Gi
  storageClassName: local-path

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mongodb
  namespace: reclicense
  labels:
    app: mongodb
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mongodb
  template:
    metadata:
      labels:
        app: mongodb
    spec:
      containers:
      - name: mongodb
        image: mongo:6.0
        args: ["mongod", "--bind_ip=0.0.0.0"]
        ports:
        - containerPort: 27017
          name: mongodb
        volumeMounts:
        - name: mongodb-data
          mountPath: /data/db
        resources:
          requests:
            memory: "2Gi"
            cpu: "1000m"
          limits:
            memory: "10Gi"
            cpu: "4000m"
      volumes:
      - name: mongodb-data
        persistentVolumeClaim:
          claimName: mongodb-pvc

---
apiVersion: v1
kind: Service
metadata:
  name: mongodb
  namespace: reclicense
  labels:
    app: mongodb
spec:
  type: ClusterIP
  ports:
  - port: 27017
    targetPort: 27017
    protocol: TCP
    name: mongodb
  selector:
    app: mongodb

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: reclicense-backend
  namespace: reclicense
  labels:
    app: reclicense-backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: reclicense-backend
  template:
    metadata:
      labels:
        app: reclicense-backend
    spec:
      containers:
      - name: backend
        image: reclicense-backend:v1.5
        imagePullPolicy: Never
        ports:
        - containerPort: 5000
          name: http
        env:
        - name: GITHUB_TOKEN
          valueFrom:
            secretKeyRef:
              name: reclicense-config
              key: GITHUB_TOKEN
        - name: RECLIC_MONGO_PORT
          value: "mongodb:27017"
        volumeMounts:
        - name: backend-files
          mountPath: /backend/temp_files
        resources:
          requests:
            memory: "6Gi"
            cpu: "4000m"
          limits:
            memory: "16Gi"
            cpu: "12000m"
      volumes:
      - name: backend-files
        persistentVolumeClaim:
          claimName: backend-files-pvc

---
apiVersion: v1
kind: Service
metadata:
  name: reclicense-backend
  namespace: reclicense
  labels:
    app: reclicense-backend
spec:
  type: ClusterIP
  ports:
  - port: 5000
    targetPort: 5000
    protocol: TCP
    name: http
  selector:
    app: reclicense-backend

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: reclicense-frontend
  namespace: reclicense
  labels:
    app: reclicense-frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: reclicense-frontend
  template:
    metadata:
      labels:
        app: reclicense-frontend
    spec:
      nodeSelector:
        node-role.kubernetes.io/worker: ""
      containers:
      - name: frontend
        image: reclicense-frontend:v1.1
        imagePullPolicy: Never
        ports:
        - containerPort: 80
          name: http
        - containerPort: 443
          name: https
        env:
        - name: REACT_APP_BASE_URL
          valueFrom:
            secretKeyRef:
              name: reclicense-config
              key: REACT_APP_BASE_URL
        resources:
          requests:
            memory: "256Mi"
            cpu: "200m"
          limits:
            memory: "2Gi"
            cpu: "1000m"

---
apiVersion: v1
kind: Service
metadata:
  name: reclicense-frontend
  namespace: reclicense
  labels:
    app: reclicense-frontend
spec:
  type: NodePort
  ports:
  - port: 80
    targetPort: 80
    nodePort: 30600
    protocol: TCP
    name: http
  selector:
    app: reclicense-frontend
